<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}} · Claude.Framework</title>
<style>
/* Claude.Framework page shell. Self-contained: no fonts, scripts or images fetched.
   The one device is the seam: a dashed vertical thread down the left margin that
   every band is stitched to. Bands are numbered because a session is a sequence. */
:root{
  --paper:#22262B; --surface:#2A2F35; --ink:#DDD9CF; --ink-muted:#9A978F;
  --thread:#C7A664; --link:#8FB3CF; --rule:#3A4049;
}
@media (prefers-color-scheme: light){
  :root{ --paper:#EEEBE3; --surface:#F6F4EE; --ink:#2A2D31; --ink-muted:#6B6E72;
         --thread:#8A6B2E; --link:#2F5E80; --rule:#CFCAC0; }
}
*{box-sizing:border-box}
html{scroll-padding-top:1rem}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  font-size:17px; line-height:1.65;
}
a{color:var(--link); text-decoration-thickness:1px; text-underline-offset:3px}
a:focus-visible{outline:2px solid var(--thread); outline-offset:3px}
.page{max-width:72ch; margin:0 auto; padding:3rem 1.25rem 5rem 3.5rem; position:relative}
.page::before{ /* the seam */
  content:""; position:absolute; left:1.5rem; top:0; bottom:0;
  border-left:2px dashed var(--thread); opacity:.55;
}
header.masthead{margin-bottom:2.5rem}
header.masthead .kind{color:var(--ink-muted); font-size:.95rem; margin:0 0 .25rem}
header.masthead h1{font-weight:400; font-size:2.1rem; line-height:1.15; margin:0 0 1rem; letter-spacing:-.01em}
.handshake{ /* status block: the part a stranger needs */
  background:var(--surface); border:1px solid var(--rule); padding:.9rem 1.1rem; font-size:.95rem;
  display:grid; grid-template-columns:max-content 1fr; gap:.3rem 1rem;
}
.handshake dt{color:var(--ink-muted)} .handshake dd{margin:0}
section.band{position:relative; margin:0 0 2.75rem; padding-left:.25rem}
section.band::before{ /* the stitch tick that ties a band to the seam */
  content:""; position:absolute; left:-2.35rem; top:.85rem; width:1.35rem;
  border-top:2px solid var(--thread);
}
section.band > h2{font-weight:400; font-size:1.35rem; margin:0 0 .75rem; line-height:1.3}
section.band > h2 .n{color:var(--thread); margin-right:.6rem; font-variant-numeric:tabular-nums}
h3{font-weight:400; font-size:1.1rem; margin:1.4rem 0 .4rem}
p{margin:0 0 1rem}
ul,ol{padding-left:1.3rem} li{margin:.25rem 0}
.parable{
  border-left:3px solid var(--thread); background:var(--surface);
  padding:.8rem 1rem .8rem 1.1rem; margin:1.25rem 0; font-style:italic;
}
.parable b{font-style:normal; font-weight:400; color:var(--ink-muted); display:block; font-size:.9rem; margin-bottom:.25rem}
.grade{ /* Jerry's grade of a parable: matched / partial / wrong */
  display:inline-block; font-style:normal; font-size:.85rem; color:var(--ink-muted);
  border:1px solid var(--rule); border-radius:2px; padding:0 .4rem; margin-left:.4rem; vertical-align:middle;
}
table{border-collapse:collapse; width:100%; margin:1rem 0; font-size:.95rem}
th,td{text-align:left; vertical-align:top; padding:.45rem .6rem; border-bottom:1px solid var(--rule)}
th{font-weight:400; color:var(--ink-muted)}
.pointers{font-size:.95rem; color:var(--ink-muted)}
.pointers code{font-family:ui-monospace,Consolas,Menlo,monospace; font-size:.9em; color:var(--ink)}
footer{margin-top:3rem; padding-top:1rem; border-top:1px solid var(--rule); color:var(--ink-muted); font-size:.9rem}
@media (max-width:640px){
  body{font-size:16px} .page{padding-left:2.6rem; padding-right:1rem}
  .page::before{left:1rem} section.band::before{left:-1.75rem; width:1rem}
  .handshake{grid-template-columns:1fr}
}
@media (prefers-reduced-motion: reduce){ *{scroll-behavior:auto !important} }
</style>
</head>
<body>
<main class="page">
  <header class="masthead">
    <p class="kind">{{KIND}}</p>              <!-- Session page / Design note / Assessment -->
    <h1>{{TITLE}}</h1>
    <dl class="handshake">
      <dt>Date</dt><dd>{{DATE}}</dd>
      <dt>Parties</dt><dd>{{PARTIES}}</dd>
      <dt>Repos</dt><dd>{{REPOS}}</dd>
      <dt>Status</dt><dd>{{STATUS}}</dd>
    </dl>
  </header>

  <section class="band" id="band-1">
    <h2><span class="n">1</span>{{BAND TITLE}}</h2>
    <p>{{BAND BODY}}</p>
    <div class="parable"><b>Parable</b>{{PARABLE}} <span class="grade">matched</span></div>
  </section>

  <section class="band" id="pointers">
    <h2><span class="n">·</span>Pointers</h2>
    <ul class="pointers">
      <li><code>Claude.Framework/docs/...</code></li>
    </ul>
  </section>

  <footer>Claude.Framework · docs/{{FOLDER}}/{{FILE}} · written {{DATE}}</footer>
</main>
</body>
</html>
