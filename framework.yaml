# Manifest of the child repos. Sync clones each into repos/<name>.
# Claude.Ontology is the renamed Claude.Ontology.Plugins. Claude.Ontology.Old is the archive and is not listed.
# Optional per child:
#   expect.tasks_before_test  tasks the Test task runs first, each in its own child process
#   expect.test_task          the task Test and plain Up run in the child (default Test)
#   expect.full_test_task     the task Test -Full and Up -Full run instead, where declared
#   expect.expected_failures  known failing tests; up to this many is pass-with-known, more is FAIL (needs reason)
#   expect.no_tests           true when the child has no *.Tests.ps1 files; reported as no-tests (needs reason)
#   verify                    a script under the child, run once per plugin by Heartbeat (or Test/Up -Verify)
# Required when build_script is true:
#   result_file               how Test gets a result file: parameter (the build takes -PesterConfiguration,
#                             TestResult only), preference (the child's Invoke-Pester merges $PesterPreference),
#                             or none (counts parsed from the Pester summary line the build prints)

requirements:
  powershell: '7.4'
  pester: '6.2.0'          # Claude.Skills needs >=6.2.0; Chain and Portal need >=5.5.0
  powershell_yaml: '0.4.12' # parses this file

children:
  - name: Claude.Root
    url: https://github.com/JerryBalmer1/Claude.Root.git
    default_branch: main
    build_script: false

  - name: Claude.Chain
    url: https://github.com/JerryBalmer1/Claude.Chain.git
    default_branch: main
    build_script: true
    result_file: preference

  - name: Claude.Substrate
    url: https://github.com/JerryBalmer1/Claude.Substrate.git
    default_branch: main
    build_script: false

  - name: Claude.Modules
    url: https://github.com/JerryBalmer1/Claude.Modules.git
    default_branch: main
    build_script: false

  - name: Claude.Skills
    url: https://github.com/JerryBalmer1/Claude.Skills.git
    default_branch: develop
    build_script: true
    result_file: preference
    expect:
      no_tests: true
      reason: no *.Tests.ps1 files in the checkout

  - name: Claude.Ontology
    url: https://github.com/JerryBalmer1/Claude.Ontology.git
    default_branch: main
    build_script: true
    result_file: parameter
    expect:
      test_task: Test
      full_test_task: TestFull
      expected_failures: 16
      reason: contract tests need built graphs
    verify:
      script: forge/tools/Invoke-PluginVerify.ps1
      plugins: [Synthetic, Prowler, Microsoft.AzureDevOps]

  - name: Claude.Portal
    url: https://github.com/JerryBalmer1/Claude.Portal.git
    default_branch: main
    build_script: true
    result_file: preference
    expect:
      tasks_before_test: [Install]

# Getters Heartbeat runs headlessly, each in its own fresh pwsh rooted in its path, by order. CLAUDE.md: a getter runs
# only from a path under repos/, never from elsewhere on disk.
# Required: name, order (whole number, unique; Diff must be last), cadence (every | weekly), entry.
#   entry       none (registered, not runnable yet; Heartbeat lists it as not runnable), or
#               script: a .ps1 under tools/ in the getter's path, parameters: name: value, where a value may hold
#               {out} (this getter's folder under .framework/heartbeats/<stamp>/), {previous} (the previous
#               heartbeat folder), {framework_root} and {repos_root}
#   path        relative to repos/; required unless entry is none
# Optional: tests (true runs the getter's Pester, JUnit under its output folder), expects (expected_failures or
# no_tests, each with reason), note.
# None of the six is under repos/ yet, so each is entry: none with no path until it is promoted.

getters:
  - name: Catalogue
    entry: none
    tests: false
    cadence: every
    order: 10
    note: not promoted to repos/ yet

  - name: Hardening
    entry: none
    tests: false
    cadence: every
    order: 20
    note: not promoted to repos/ yet

  - name: Incidents
    entry: none
    tests: false
    cadence: every
    order: 30
    note: not promoted to repos/ yet

  - name: Shape
    entry: none
    tests: false
    cadence: every
    order: 40
    note: not promoted to repos/ yet

  - name: Secrets
    entry: none
    tests: false
    cadence: every
    order: 50
    note: not promoted to repos/ yet

  - name: Diff
    entry: none
    tests: false
    cadence: every
    order: 90
    note: not promoted to repos/ yet
