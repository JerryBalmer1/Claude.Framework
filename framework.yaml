# Manifest of the child repos. Sync clones each into repos/<name>.
# Claude.Ontology is the renamed Claude.Ontology.Plugins. Claude.Ontology.Old is the archive and is not listed.
# Optional per child:
#   expect.tasks_before_test  tasks the Test task runs first, each in its own child process
#   expect.test_task          the task Test and plain Up run in the child (default Test)
#   expect.full_test_task     the task Test -Full and Up -Full run instead, where declared
#   expect.expected_failures  known failing tests; up to this many is pass-with-known, more is FAIL (needs reason)
#   expect.no_tests           true when the child has no *.Tests.ps1 files; reported as no-tests (needs reason)
#   verify                    a script under the child, run once per plugin by Heartbeat (or Test/Up -Verify)
#   branch                    the branch the child must be on (default: default_branch). Requirements fails a row,
#                             Test refuses the child and Up stops when the checkout is on any other branch.
# Required when build_script is true:
#   result_file               how Test gets a result file: parameter (the build takes -PesterConfiguration,
#                             TestResult only), preference (the child's Invoke-Pester merges $PesterPreference),
#                             or none (counts parsed from the Pester summary line the build prints)

requirements:
  powershell: '7.4'
  pester: '6.2.0'          # Claude.Skills needs >=6.2.0; Chain and Portal need >=5.5.0
  powershell_yaml: '0.4.12' # parses this file

# Environment variables the build derives itself. Requirements, Test and Heartbeat set each in their own process, so
# every child pwsh, Verify and getter inherits the derived value, not a stale shell's; a differing shell value is
# noted, not failed. Bootstrap persists each to User scope. value takes {framework_root} and {repos_root}, as getters do.
# Required: name, value, wanted (file exists).
env:
  - name: CLAUDE_CHAIN_LEDGER
    value: '{repos_root}\Claude.Chain\ledger\chain.jsonl'
    wanted: file exists

children:
  - name: Claude.Root
    url: https://github.com/JerryBalmer1/Claude.Root.git
    default_branch: main
    branch: main
    build_script: false

  - name: Claude.Chain
    url: https://github.com/JerryBalmer1/Claude.Chain.git
    default_branch: main
    branch: main
    build_script: true
    result_file: preference

  - name: Claude.Substrate
    url: https://github.com/JerryBalmer1/Claude.Substrate.git
    default_branch: main
    branch: main
    build_script: false

  - name: Claude.Modules
    url: https://github.com/JerryBalmer1/Claude.Modules.git
    default_branch: main
    branch: main
    build_script: true
    result_file: parameter
    expect:
      test_task: Test

  - name: Claude.Skills
    url: https://github.com/JerryBalmer1/Claude.Skills.git
    default_branch: develop
    branch: develop
    build_script: true
    result_file: preference
    expect:
      test_task: Test

  - name: Claude.Ontology
    url: https://github.com/JerryBalmer1/Claude.Ontology.git
    default_branch: main
    branch: main
    build_script: true
    result_file: parameter
    expect:
      test_task: Test
      full_test_task: TestFull
      expected_failures: 16
      reason: contract tests need built graphs
    verify:
      script: forge/tools/Invoke-PluginVerify.ps1
      plugins: [Synthetic, Prowler, Microsoft.AzureDevOps]

  - name: Claude.Portal
    url: https://github.com/JerryBalmer1/Claude.Portal.git
    default_branch: main
    branch: main
    build_script: true
    result_file: preference
    expect:
      tasks_before_test: [Install]

# Getters Heartbeat runs headlessly, each in its own fresh pwsh rooted in its path, after the getters it needs and
# otherwise by order. CLAUDE.md: a getter runs only from a path under repos/, never from elsewhere on disk.
# Required: name, order (whole number, unique; Diff must be last), cadence (every | weekly), entry.
#   entry       none (registered, not runnable yet; Heartbeat lists it as not runnable), or
#               script: a .ps1 under tools/ in the getter's path, parameters: name: value, where a value may hold
#               {out} (this getter's folder under .framework/heartbeats/<stamp>/), {previous} (the previous
#               heartbeat folder), {framework_root} and {repos_root}
#   path        relative to repos/; required unless entry is none
# Optional: needs (getter names that must run first; one that failed or refused skips this getter with "needs <x>";
# an unknown name or a cycle refuses the heartbeat before it starts), tests (true runs the getter's Pester, JUnit under
# its output folder), expects (expected_failures or no_tests, each with reason), outputs (file names the entry must
# leave under {out}; a missing one fails the getter), note. A getter whose path is a child's folder runs only while
# that child is on its expected branch.
# Each getter ends ok, failed, refused or skipped. Refused is a non-zero exit whose last printed line begins "refused".
# The verdict line is the first line of {out}/verdict.txt, else the last line the entry printed.
# Shape, Secrets, Coverage and Diff are promoted (Claude.Modules); the others are entry: none with no path until they are.
# Diff is the only getter that reads earlier heartbeats, and it is always last.

getters:
  - name: Catalogue
    entry: none
    tests: false
    cadence: every
    order: 10
    note: not promoted to repos/ yet

  - name: Hardening
    entry: none
    tests: false
    cadence: every
    order: 20
    note: not promoted to repos/ yet

  - name: Incidents
    entry: none
    tests: false
    cadence: every
    order: 30
    note: not promoted to repos/ yet

  - name: Shape
    path: Claude.Modules
    entry:
      script: tools/Get-FrameworkShape.ps1
      parameters:
        Root: '{framework_root}'
        Out: '{out}'
    outputs: [graph.json]
    tests: false
    cadence: every
    order: 40

  - name: Secrets
    path: Claude.Modules
    entry:
      script: tools/Find-FrameworkSecret.ps1
      parameters:
        Root: '{framework_root}'
        Out: '{out}'
    outputs: [findings.json, summary.md]
    tests: false
    cadence: every
    order: 50

  # -Graph is not passed: it defaults to {out}\..\Shape\graph.json, the sibling folder Heartbeat gives Shape.
  - name: Coverage
    path: Claude.Modules
    entry:
      script: tools/Get-FrameworkCoverage.ps1
      parameters:
        Root: '{framework_root}'
        Out: '{out}'
    outputs: [coverage.json, coverage.md]
    needs: [Shape]
    tests: false
    cadence: every
    order: 60

  # -Before and -After are not passed: -After defaults to {out}\.., the heartbeat Diff runs inside, and -Before to the
  # newest older heartbeat beside it that holds a heartbeat.json. With none, Diff refuses (a refused outcome, not failed).
  - name: Diff
    path: Claude.Modules
    entry:
      script: tools/Get-FrameworkDiff.ps1
      parameters:
        Root: '{framework_root}'
        Out: '{out}'
    outputs: [diff.json, diff.md, verdict.txt]
    needs: [Shape]
    tests: false
    cadence: every
    order: 90
